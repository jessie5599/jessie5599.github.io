<style>
  :root{
    --navy:#1B2A41;
    --navy-deep:#101C2C;
    --teal:#128F76;
    --teal-soft:#DCEFEA;
    --orange:#E67E22;
    --cream:#F7F5F0;
    --paper:#FFFFFF;
    --ink:#2B2B2B;
    --ink-soft:#5B6472;
    --line:#E3DFD5;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Pretendard', sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:'Gowun Dodum', sans-serif;
    margin:0;
    color:var(--navy);
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  /* Header (동일 구조: index.html과 공유) */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,245,240,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;max-width:1120px;margin:0 auto;
  }
  .brand{font-family:'Gowun Dodum',sans-serif;font-weight:700;font-size:19px;color:var(--navy);}
  .brand span{color:var(--teal);}
  .navlinks{display:flex;gap:28px;font-size:14.5px;font-weight:500;color:var(--navy);}
  .navlinks a{padding:6px 0;border-bottom:2px solid transparent;transition:border-color .2s;}
  .navlinks a:hover{border-color:var(--orange);}
  .navlinks a.active{border-color:var(--teal);color:var(--teal);}
  .nav-cta{
    background:var(--orange);color:#fff;padding:9px 18px;border-radius:3px;
    font-size:14px;font-weight:600;white-space:nowrap;
  }
  .nav-right{display:flex;align-items:center;gap:12px;}
  .nav-toggle{
    display:none;flex-direction:column;justify-content:center;gap:5px;
    width:32px;height:32px;background:none;border:none;cursor:pointer;padding:0;
  }
  .nav-toggle span{display:block;width:100%;height:2px;background:var(--navy);border-radius:2px;}
  @media(max-width:760px){
    .nav-toggle{display:flex;}
    .navlinks{
      display:none;position:absolute;top:100%;left:0;right:0;
      flex-direction:column;gap:0;background:var(--paper);
      border-bottom:1px solid var(--line);padding:4px 24px 12px;
      box-shadow:0 8px 16px rgba(0,0,0,0.06);
    }
    .navlinks.open{display:flex;}
    .navlinks a{padding:12px 4px;border-bottom:1px solid var(--line);}
    .navlinks a:last-child{border-bottom:none;}
  }

  /* Page head */
  .page-head{padding:56px 0 28px;}
  .page-head .eyebrow{color:var(--teal);font-weight:600;font-size:13.5px;letter-spacing:.02em;}
  .page-head h1{font-size:30px;line-height:1.4;font-weight:600;margin-top:10px;}
  .page-head p{color:var(--ink-soft);font-size:15px;margin-top:10px;max-width:560px;}

  /* Filters */
  .filters{
    display:flex;gap:8px;flex-wrap:wrap;
    padding-bottom:32px;
  }
  .filter-btn{
    padding:8px 16px;border-radius:20px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:13.5px;font-weight:600;
    cursor:pointer;transition:all .15s;
  }
  .filter-btn:hover{border-color:var(--teal);color:var(--teal);}
  .filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* Grid */
  .archive-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
    padding-bottom:80px;
  }
  @media(max-width:900px){ .archive-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .archive-grid{grid-template-columns:1fr;} }

  .arc-card{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:box-shadow .2s, transform .2s;
  }
  .arc-card:hover{box-shadow:0 10px 24px rgba(27,42,65,0.09);transform:translateY(-2px);}
  .arc-thumb{
    width:100%;aspect-ratio:1/1;object-fit:cover;
    background:var(--teal-soft);flex-shrink:0;
  }
  .arc-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .arc-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .arc-label{
    display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;
    background:var(--teal-soft);color:var(--teal);white-space:nowrap;
  }
  .arc-label[data-cat="고등부"]{background:#1B2A41;color:#fff;}
  .arc-label[data-cat="중등부"]{background:#FCE9D6;color:var(--orange);}
  .arc-label[data-cat="제씨영어소식"]{background:#EDEBE4;color:var(--ink-soft);}
  .arc-card h3{font-size:15.5px;line-height:1.45;font-weight:600;}
  .arc-excerpt{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .arc-empty{padding:60px 0;text-align:center;color:var(--ink-soft);}

  /* Footer */
  footer{background:var(--navy-deep);color:#B9C2CE;padding:32px 0;}
  .footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;}
  .footer-inner .brand{color:#B9C2CE;}
  .footer-inner .brand span{color:var(--teal);}

<section class="page-head">

<section>
  <div class="wrap">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="전체">전체</button>

    <p style="margin:0;">부천시 범안로 231-15 옥길중앙타워 1002호 · 010-8040-5599</p>
  </div>
</footer>

<script>
(function(){
  var toggle = document.getElementById('navToggle');
  var links = document.getElementById('navlinks');
  if(toggle && links){
    toggle.addEventListener('click', function(){
      var isOpen = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>

<script>
(function(){
  var grid = document.getElementById('archive-grid');
  var filters = document.getElementById('filters');
  var allItems = [];
  var currentFilter = '전체';

  function formatDate(pubDate){
    var d = new Date(pubDate);
    if(isNaN(d)) return '';
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  function render(){
    var list = currentFilter === '전체' ? allItems : allItems.filter(function(it){ return it.label === currentFilter; });
    if(!list.length){
      grid.innerHTML = '<p class="arc-empty">아직 게시물이 없어요.</p>';
      return;
    }
    grid.innerHTML = list.map(function(it){
      var thumbImg = it.thumbnail
        ? '<img class="arc-thumb" src="' + it.thumbnail + '" referrerpolicy="no-referrer" loading="lazy" alt="">'
        : '<div class="arc-thumb"></div>';
      return '<a class="arc-card" href="' + it.link + '" target="_blank" rel="noopener">' +
        thumbImg +
        '<div class="arc-body">' +
        '<div class="arc-meta"><span class="arc-label" data-cat="' + it.label + '">' + it.label + '</span><span>' + formatDate(it.pubDate) + '</span></div>' +
        '<h3>' + it.title + '</h3>' +
        '<p class="arc-excerpt">' + (it.excerpt || '') + '</p>' +
        '</div></a>';
    }).join('');
  }

  filters.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    filters.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });

  fetch('./blog-feed.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allItems = (data.archive && data.archive.length) ? data.archive : (data.items || []);
      render();
    })
    .catch(function(){
      grid.innerHTML = '<p class="arc-empty">글 목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>';
    });
})();
</script>
